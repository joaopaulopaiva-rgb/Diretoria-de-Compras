name: Portão de entrada — decisões + atualização geral

# Dispara quando o botão "Entrar no painel" (docs/index.html) abre uma
# issue nova — decisões pendentes vêm no corpo como bloco ```json```, ou
# corpo vazio quando é só um pedido de atualização geral. Substitui a
# checagem periódica que existia antes (rodava presa numa sessão do Claude
# Code, reprocessando um histórico de conversa enorme a cada disparo) —
# decisão combinada com a pessoa dona do projeto em 28/08/2026.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  processar:
    if: github.event.issue.title == 'Atualização do portão de entrada'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Salvar corpo da issue em arquivo
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$ISSUE_BODY" > /tmp/issue_body.txt

      - name: Extrair decisões do corpo da issue (se houver)
        id: extrair
        run: |
          DECISOES=$(python3 scripts/extrair_json_issue.py /tmp/issue_body.txt)
          echo "decisoes=$DECISOES" >> "$GITHUB_OUTPUT"

      - name: Aplicar decisões (se houver)
        if: steps.extrair.outputs.decisoes != '[]'
        env:
          DECISOES: ${{ steps.extrair.outputs.decisoes }}
        run: |
          printf '%s' "$DECISOES" > /tmp/decisoes.json
          python3 scripts/aplicar_decisoes.py /tmp/decisoes.json > /tmp/resultado_aplicar.json
          cat /tmp/resultado_aplicar.json

      - name: Rodar atualização geral de marcos
        run: python3 scripts/atualizar_marcos.py > /tmp/resultado_marcos.json
        continue-on-error: true

      - name: Revisar processos ignorados
        run: python3 scripts/revisar_ignorados.py > /tmp/resultado_ignorados.json
        continue-on-error: true

      - name: Commitar mudanças (se houver)
        run: |
          git config user.name "painel-compras-bot"
          git config user.email "painel-compras-bot@users.noreply.github.com"
          git add data/*.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualização via portão de entrada (issue #${{ github.event.issue.number }})"
            git push
          else
            echo "Nada novo para commitar."
          fi

      - name: Comentar e fechar issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 scripts/comentar_fechar_issue_portao.py > /tmp/comentario.txt
          FECHAR=$?
          set -e
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file /tmp/comentario.txt
          if [ "$FECHAR" -eq 0 ]; then
            gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}"
          fi
