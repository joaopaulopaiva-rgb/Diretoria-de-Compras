name: Publicar painel no GitHub Pages

on:
  push:
    branches: [main, claude/visual-process-control-system-h8tf2j]
    paths:
      - "docs/**"
      - "data/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Montar site (docs/ + data/ juntos, já que o front-end lê data/*.json por caminho relativo)
        run: |
          mkdir -p _site
          cp docs/index.html _site/index.html
          cp -r data _site/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
